name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sonnik.keystore"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/sonnik.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets are not set: the release APK is unsigned and cannot be installed."
          fi

      - name: Test and build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SCREENSHOTS: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: ./gradlew --no-daemon testFullReleaseUnitTest assembleFullRelease assembleFdroidRelease

      # Сборка для F-Droid не должна содержать несвободных библиотек и просить доступ в сеть.
      - name: Check F-Droid build
        run: |
          APK=$(ls app/build/outputs/apk/fdroid/release/app-fdroid-release*.apk)
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions "$APK"
          if "$AAPT2" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "::error::The fdroid build must not request INTERNET"; exit 1
          fi
          if unzip -p "$APK" 'classes*.dex' | grep -aq "Lcom/google/android/gms"; then
            echo "::error::The fdroid build contains Google Play services"; exit 1
          fi

      - name: Commit UI screenshots
        if: always() && github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          if ls app/build/screenshots/*.png >/dev/null 2>&1; then
            mkdir -p docs/screenshots && cp app/build/screenshots/*.png docs/screenshots/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Новые схемы базы Room тоже сохраняем — по ним проверяются миграции.
            git add docs/screenshots app/schemas
            git commit -m "Скриншоты интерфейса (сборка ${{ github.run_number }})" && git push || true
          fi

      - name: Rename APK
        run: |
          VERSION=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          # В релиз идёт сборка full (её подписью обновляются установленные копии); fdroid F-Droid собирает сам.
          cp app/build/outputs/apk/full/release/app-full-release*.apk "dist/SonnikToPower-$VERSION.apk"
          ls app/build/outputs/apk/fdroid/release/app-fdroid-release*.apk
          awk '/^## /{n++} n==1' changelog/changelog_ru.md > release-notes.md

      # APK и так прикладывается к релизу; квота хранилища артефактов не должна ронять сборку.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SonnikToPower-${{ env.APP_VERSION }}-build${{ github.run_number }}
          path: dist/*.apk
          retention-days: 7

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: SonnikToPower ${{ env.APP_VERSION }}
          body_path: release-notes.md
          files: dist/*.apk
          make_latest: true
